# 매일 한국시간 오전 6시 10분: 29CM 의류 랭킹(일간·주간·월간) 수집 → (상세정보 → 후기 요약) → 분석 → 리포트
# 29CM은 지난 랭킹을 다시 받을 수 없음 → 낮 12시·밤 8시에 빠진 것만 다시 받음 (다 있으면 갱신 시각 추정용 기록만)
# 무신사 리포트(정각)와 겹치지 않게 10분 뒤에 돎
name: 29cm-daily-report

on:
  schedule:
    - cron: "10 21 * * *"  # UTC 21:10 = KST 다음 날 06:10 — 본 실행 (GitHub 사정으로 10~20분 늦을 수 있음)
    - cron: "10 3 * * *"   # UTC 03:10 = KST 12:10 — 재확인 (오늘 수집이 빠진 기간만)
    - cron: "10 11 * * *"  # UTC 11:10 = KST 20:10 — 재확인
  workflow_dispatch:       # Actions 탭에서 수동 실행 버튼 (빠진 것만 받음)

permissions:
  contents: write

concurrency:
  group: daily-report
  cancel-in-progress: false

jobs:
  report:
    runs-on: ubuntu-latest
    timeout-minutes: 300   # 랭킹만이면 10분 안쪽. 상세정보는 새 상품 1개에 10초 (1,000개면 약 3시간)
    # 실패 알림: 이 작업이 실패하면 GitHub이 저장소 주인 계정 이메일로 자동 알림을 보냄 (별도 메일 설정 없음)
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: 수집 · 분석 · 리포트 생성
        run: |
          if [ "${{ github.event.schedule }}" = "10 21 * * *" ]; then
            python tools/run_daily.py
          else
            python tools/run_daily.py --only-missing
          fi

      - name: 기록과 리포트 저장(push)
        id: save
        if: always()   # 도중에 멈춰도 받은 상세정보는 저장
        run: |
          git config user.name "29cm-report-bot"
          git config user.email "actions@users.noreply.github.com"
          D=$(TZ=Asia/Seoul date +%F)
          BEFORE=$(git rev-parse HEAD)
          git add data docs
          git commit -m "daily report $D" || echo "변경 없음"
          git push
          # 이번 실행에서 오늘 일간 랭킹이 새로 저장됐으면 → 다음 단계에서 Claude 작업 시작
          if git diff --name-only "$BEFORE" HEAD | grep -qx "data/history/$D.csv"; then
            echo "fresh=yes" >> "$GITHUB_OUTPUT"
          fi

      # 수집이 끝나자마자 Claude 루틴(사진 판독 → 급상승 원인 조사 → 리포트 다시 만들기)을 시작 (2026-09-27 사장님: 10시까지 기다리지 말 것)
      # 비밀값 2개(CLAUDE_ROUTINE_URL, CLAUDE_ROUTINE_TOKEN)는 claude.ai 루틴 편집 → API 트리거에서 받아 GitHub Secrets에 넣음
      - name: Claude 사진 판독·원인 조사 시작
        if: always() && steps.save.outputs.fresh == 'yes'   # 주간·월간 수집이 실패해도 일간이 저장됐으면 시작
        env:
          FIRE_URL: ${{ secrets.CLAUDE_ROUTINE_URL }}
          FIRE_TOKEN: ${{ secrets.CLAUDE_ROUTINE_TOKEN }}
        run: |
          if [ -z "$FIRE_URL" ] || [ -z "$FIRE_TOKEN" ]; then
            echo "루틴 주소·토큰이 아직 없음 → 건너뜀 (루틴의 예약 시간에 돌아감)"; exit 0
          fi
          # 비밀값에 붙여넣기 때 섞인 공백·줄바꿈·따옴표·curl 명령 전체 등은 버리고 주소·토큰만 골라냄
          # (2026-09-28·29: 주소 비밀값 형식 문제로 curl exit 3 → 이틀 다 13시 예비 예약에만 돎)
          URL=$(printf '%s' "$FIRE_URL" | grep -oE 'https://api\.anthropic\.com/v1/claude_code/routines/trig_[A-Za-z0-9]+/fire' | head -1)
          TOKEN=$(printf '%s' "$FIRE_TOKEN" | grep -oE 'sk-ant-[A-Za-z0-9_-]+' | head -1)
          [ -n "$TOKEN" ] && echo "::add-mask::$TOKEN"
          if [ -z "$URL" ]; then
            echo "::error::CLAUDE_ROUTINE_URL 비밀값에서 루틴 주소(https://api.anthropic.com/v1/claude_code/routines/trig_…/fire)를 못 찾음 → 다시 넣어 주세요"; exit 1
          fi
          if [ -z "$TOKEN" ]; then
            echo "::error::CLAUDE_ROUTINE_TOKEN 비밀값에서 토큰(sk-ant-…)을 못 찾음 → 다시 넣어 주세요"; exit 1
          fi
          CODE=$(curl -sS -o fire.json -w '%{http_code}' -X POST "$URL" \
            -H "Authorization: Bearer $TOKEN" \
            -H "anthropic-beta: experimental-cc-routine-2026-04-01" \
            -H "anthropic-version: 2023-06-01" \
            -H "Content-Type: application/json" \
            -d '{}') || { echo "::error::루틴 주소에 연결 못 함"; exit 1; }
          if [ "$CODE" != "200" ] && [ "$CODE" != "201" ]; then
            echo "::error::루틴 시작 거절 (HTTP $CODE, 401 = 토큰 틀림·만료 → 루틴 편집에서 토큰 다시 발급) — 9시 예비 예약에 돎"
            cat fire.json; echo; exit 1
          fi
          echo "루틴 시작됨:"; cat fire.json; echo; rm -f fire.json
