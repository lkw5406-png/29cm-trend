# 29CM 랭킹 갱신 시각 관찰 (임시): 매시간 일간·주간·월간 전체 랭킹 상위 20개를 data/ranking_updates.json에 기록
# 29CM이 갱신 시각을 알려주지 않아서, 며칠 치를 보고 순위가 바뀌는 시각을 찾는다 (요청 6번/시간).
# 갱신 시각이 정해지면 이 파일은 지운다 (2026-10-11 사장님 지시로 시작).
name: 29cm-update-probe

on:
  schedule:
    - cron: "40 * * * *"   # 매시 40분 (본 수집 06:10·12:10·20:10 과 겹치지 않게)
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: daily-report      # 본 수집과 동시에 저장(push)하지 않게 같은 줄에 세움
  cancel-in-progress: false

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: 상위 20개 기록
        run: python tools/twentynine_fetch.py --probe
      - name: 저장(push)
        run: |
          git config user.name "29cm-report-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/ranking_updates.json
          git commit -m "probe $(TZ=Asia/Seoul date '+%F %H:%M')" || echo "변경 없음"
          git pull --rebase
          git push
